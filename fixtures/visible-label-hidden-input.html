<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Label Wraps Hidden Input</title></head>
<body>
<h2>Do you agree?</h2>
<label style="display:block; padding:8px; background:#eee;">
  <input type="radio" name="agree" value="yes" style="position:absolute; opacity:0;">
  Yes, I agree
</label>
<label style="display:block; padding:8px; background:#eee;">
  <input type="radio" name="agree" value="no" style="position:absolute; opacity:0;">
  No, I do not agree
</label>
</body>
</html>

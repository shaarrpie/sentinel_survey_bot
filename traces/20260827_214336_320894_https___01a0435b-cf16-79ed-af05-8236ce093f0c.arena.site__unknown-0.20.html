<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'"><title>Sentinel trace</title>
<style>
:root{ --bg0:#0d1320; --bg1:#121b2d; --line:#20304c; --ink:#dbe6f5;
       --dim:#7e90ac; --faint:#4d5f7c; --ok:#3ddc84; --err:#ff6161;
       --warn:#ffb347; --ai:#59c2ff; --act:#9db4d6; }
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;padding:16px;color:var(--ink);
  font-family:"Segoe UI","Helvetica Neue",sans-serif;
  background:
   radial-gradient(460px 240px at -10% -20%, rgba(89,194,255,.10), transparent 60%),
   radial-gradient(420px 260px at 112% 122%, rgba(61,220,132,.08), transparent 62%),
   repeating-linear-gradient(0deg, transparent 0 23px, rgba(126,144,172,.05) 23px 24px),
   linear-gradient(160deg, var(--bg1), var(--bg0));}
.display{font-family:Bahnschrift,"Avenir Next Condensed","Arial Narrow",sans-serif}
.mono{font-family:ui-monospace,Consolas,monospace}
header{display:flex;align-items:center;gap:14px;padding:6px 4px 14px;border-bottom:1px solid var(--line)}
.word{font-size:26px;font-weight:700;letter-spacing:.14em}
.chip{font-size:10px;letter-spacing:.08em;padding:3px 8px;border-radius:4px;border:1px solid var(--line);color:var(--dim)}
.chip.ok{color:var(--ok);border-color:rgba(61,220,132,.4)}
.chip.ai{color:var(--ai);border-color:rgba(89,194,255,.4)}
.chip.err{color:var(--err);border-color:rgba(255,97,97,.4)}
.lat{margin-left:auto;text-align:right;font-size:12px;color:var(--dim)}
.lat b{display:block;font-size:18px;color:var(--ink)}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4fr);gap:14px;margin-top:14px}
.panel{border:1px solid var(--line);border-radius:6px;background:rgba(8,12,21,.7);padding:12px}
.panel h2{font-size:9px;letter-spacing:.26em;color:var(--faint);margin-bottom:9px}
pre{white-space:pre-wrap;word-break:break-word;font-size:11px;line-height:1.6;color:#c3d2e8;max-height:420px;overflow:auto}
img.shot{width:100%;border:1px solid var(--line);border-radius:4px;display:block}
table{width:100%;border-collapse:collapse;font-size:10.5px}
th{font-size:8.5px;letter-spacing:.18em;color:var(--faint);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:4px 6px;border-bottom:1px solid rgba(32,48,76,.5);color:#c3d2e8;font-family:ui-monospace,Consolas,monospace;vertical-align:top}
tr.hot td{color:var(--warn);background:rgba(255,179,71,.06)}
tr.hot td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.foot{margin-top:12px;font-size:9px;color:var(--faint)}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style></head>
<body>
<header>
  <div class="word display" id="word">TRACE</div>
  <div id="chips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  <div class="lat mono"><b id="lat">–</b>ms latency</div>
</header>
<div class="grid">
  <div>
    <div class="panel"><h2>SCREENSHOT (as sent, may be truncated)</h2><div id="shot"></div></div>
    <div class="panel" style="margin-top:14px"><h2>PAGE TEXT (first 4000)</h2><pre id="ptext"></pre></div>
    <div class="panel" style="margin-top:14px"><h2>ELEMENT MAP</h2><div id="emap"></div></div>
  </div>
  <div>
    <div class="panel"><h2>DECISION</h2><pre id="dec"></pre></div>
    <div class="panel" style="margin-top:14px"><h2>ASSEMBLED PROMPT</h2><pre id="prom"></pre></div>
    <div class="panel" style="margin-top:14px"><h2>LEARNED RULES IN EFFECT</h2><pre id="rul"></pre></div>
    <div class="panel" style="margin-top:14px"><h2>SESSION MEMORY CONTEXT</h2><pre id="mem"></pre></div>
  </div>
</div>
<div class="foot mono" id="foot"></div>
<script>
const R = JSON.parse(decodeURIComponent("%7B%22ts%22%3A%20%222026-08-27T21%3A43%3A36.549722%22%2C%20%22session%22%3A%20%22null-1787847182285%22%2C%20%22url%22%3A%20%22https%3A%2F%2F01a0435b-cf16-79ed-af05-8236ce093f0c.arena.site%2F%22%2C%20%22dry_run%22%3A%20false%2C%20%22cycle%22%3A%20%22c37a88%22%2C%20%22path%22%3A%20%22heuristic%22%2C%20%22confidence%22%3A%200.2%2C%20%22decision%22%3A%20%7B%22page_summary%22%3A%20%22heuristic%22%2C%20%22question_type%22%3A%20%22unknown%22%2C%20%22confidence%22%3A%200.2%2C%20%22actions%22%3A%20%5B%7B%22action_type%22%3A%20%22next%22%2C%20%22element_id%22%3A%20null%2C%20%22coordinates%22%3A%20null%2C%20%22value%22%3A%20null%2C%20%22reasoning%22%3A%20%22page%20answered%20-%3E%20next%22%7D%5D%2C%20%22memory_note%22%3A%20%22page%20complete%22%7D%2C%20%22page_text%22%3A%20%22Built%20with%20Arena%5Cn%5CnContent%20is%20user-generated%20and%20unverified%5Cn%5BIFRAME%20CONTENT%5D%5CnSS%5CnSurvey%20Spectrometer%5Cn%F0%9F%93%8B%20Catalog7%5Cn%F0%9F%93%8A%20Dashboard100%5Cnbuild%20r8%20%C2%B7%20v1.0%5CnTesting%20Dashboard%5Cn%5Cn1%20survey%20run%20%C2%B716%20questions%20processed%5Cn%5CnClear%20All%20Results%5Cn100%5Cn%2F100%5CnCompatibility%20Score%5Cn100%25%5CnType%20Detection%5Cn16%20correct%5Cn100%25%5CnInteraction%20Success%5Cn16%20total%5Cn19510ms%5CnAvg%20Response%20Time%5Cn100%25%20completion%5Cn100%25%5CnUI%20Element%20Detection%5Cn100%25%5CnHoneypot%20Avoidance%5Cn100%25%5CnTiming%20Compliance%5Cn1%2F1%5CnSurveys%20Completed%5CnAccuracy%20by%20Question%20Type%5Cninstructio%E2%80%A6%5Cnmcq-multiple%5Cntrue-false%5Cnrating-scale%5Cnstar-rating%5Cndate-time%5Cnranking%5Cnimage-ques%E2%80%A6%5Cn0%5Cn25%5Cn50%5Cn75%5Cn100%5CnAccuracy%20by%20Layout%5Cnminimal%5CnSurvey%20Results%5CnSurvey%5CtLayout%5CtStatus%5CtProgress%5CtScore%5CtTime%5CnKitchen%20Sink%20Survey%5Ctminimal%5Ctcompleted%5Ct16%2F17%5Ct94%25%5Ct8%2F27%2F2026%2C%209%3A43%3A14%20PM%5CnRecent%20Test%20Logs%5CnQuestion%20%5C%22Welcome%20to%20the%20Kitchen%20Sink%20Survey%21%E2%80%A6%5C%22%20processed%5CnDetected%20type%3A%20instructional%20%28expected%3A%20instructional%29%5CnResponse%20time%3A%2019510ms%5CnQuestion%20%5C%22Tell%20us%20about%20yourself%20in%20one%20sentence.%E2%80%A6%5C%22%20processed%5CnDetected%20type%3A%20open-ended%20%28expected%3A%20open-ended%29%5CnResponse%20time%3A%2019510ms%5CnQuestion%20%5C%22What%20is%20your%20primary%20programming%20languag%E2%80%A6%5C%22%20processed%5CnDetected%20type%3A%20mcq-single%20%28expected%3A%20mcq-single%29%5CnResponse%20time%3A%2019510ms%5CnQuestion%20%5C%22Which%20frameworks%20have%20you%20used%3F%20%28Select%20%E2%80%A6%5C%22%20processed%5CnDetected%20type%3A%20mcq-multiple%20%28expected%3A%20mcq-multiple%29%5CnResponse%20time%3A%2019510ms%5CnQuestion%20%5C%22Do%20you%20write%20tests%20for%20your%20code%3F%E2%80%A6%5C%22%20processed%5CnDetected%20type%3A%20yes-no%20%28expected%3A%20yes-no%29%5CnResponse%20time%3A%2019510ms%5CnQuestion%20%5C%22JavaScript%20is%20a%20statically%20typed%20languag%E2%80%A6%5C%22%20processed%5CnDetected%20type%3A%20true-false%20%28expected%3A%20true-false%29%5CnResponse%20time%3A%2019510ms%5CnQuestion%20%5C%22What%20is%20your%20experience%20level%3F%E2%80%A6%5C%22%20processed%5CnDetected%20type%3A%20dropdown%20%28expected%3A%20dropdown%29%5CnResponse%20time%3A%2019510ms%5CnQuestion%20%5C%22Rate%20your%20satisfaction%20with%20remote%20work.%E2%80%A6%5C%22%20processed%5CnDetected%20type%3A%20rating-scale%20%28expected%3A%20rating-scale%29%5CnResponse%20time%3A%2019510ms%5CnQuestion%20%5C%22How%20strongly%20do%20you%20agree%3A%20%5C%22AI%20will%20repl%E2%80%A6%5C%22%20processed%5CnDetected%20type%3A%20likert%20%28expected%3A%20likert%29%5CnResponse%20time%3A%2019510ms%5CnQuestion%20%5C%22How%20would%20you%20rate%20this%20survey%20experienc%E2%80%A6%5C%22%20processed%5CnDetected%20type%3A%20star-rating%20%28expected%3A%20star-rating%29%5CnResponse%20time%3A%2019510ms%5CnQuestion%20%5C%22How%20many%20pull%20requests%20did%20you%20merge%20las%E2%80%A6%5C%22%2 2%2C%20%22x%22%3A%20400%2C%20%22y%22%3A%2028%7D%2C%20%7B%22id%22%3A%204%2C%20%22sid%22%3A%20%22n97%22%2C%20%22frame%22%3A%20true%2C%20%22tag%22%3A%20%22button%22%2C%20%22type%22%3A%20%22submit%22%2C%20%22text%22%3A%20%22%F0%9F%93%8A%20Dashboard100%22%2C%20%22x%22%3A%20532%2C%20%22y%22%3A%2028%7D%2C%20%7B%22id%22%3A%205%2C%20%22sid%22%3A%20%22n98%22%2C%20%22frame%22%3A%20true%2C%20%22tag%22%3A%20%22button%22%2C%20%22type%22%3A%20%22submit%22%2C%20%22text%22%3A%20%22Clear%20All%20Results%22%2C%20%22x%22%3A%201339%2C%20%22y%22%3A%20109%7D%5D%2C%20%22latency_ms%22%3A%201%7D"));
document.title = "trace " + (R.ts || "");
const chip = (t, c) => `<span class="chip ${c||''}">${t}</span>`;
document.getElementById("chips").innerHTML =
  chip(R.path, R.path === "error" ? "err" : (R.path === "model" ? "ai" : "ok")) +
  chip((R.question_type || (R.decision && R.decision.question_type) || "–")) +
  (R.dry_run ? chip("DRY RUN", "err") : "") +
  (R.snap_truncated ? chip("image truncated in trace", "") : "");
document.getElementById("word").textContent =
  R.path === "heuristic" ? "HEURISTIC" : (R.path === "model" ? "MODEL CALL" : (R.path === "error" ? "FAILURE" : "TRACE"));
document.getElementById("lat").textContent = R.latency_ms != null ? R.latency_ms : "–";
const shot = document.getElementById("shot");
if (R.snap_b64 && !R.snap_truncated) {
  const img = new Image();
  img.className = "shot"; img.src = "data:" + (R.snap_mime||"image/jpeg") + ";base64," + R.snap_b64;
  shot.appendChild(img);
} else if (R.snap_b64) {
  shot.innerHTML = '<div style="font-size:11px;color:var(--warn)">stored prefix only (' +
    R.snap_b64.length + ' chars) — raise SENTINEL_SNAP_MAX to embed the full frame</div>';
} else { shot.innerHTML = '<div style="font-size:11px;color:var(--faint)">no image on this path</div>'; }
document.getElementById("ptext").textContent = R.page_text || "–";
const hot = new Set(((R.decision||{}).actions||[]).map(a => a.element_id).filter(v => v !== null && v !== undefined));
let rows = "<table><tr><th>ID</th><th>TAG</th><th>TYPE</th><th>TEXT</th><th>X,Y</th></tr>";
(R.elements||[]).forEach(e => {
  const cls = hot.has(e.id) ? ' class="hot"' : '';
  rows += `<tr${cls}><td>${e.id}</td><td>${e.tag||''}</td><td>${e.type||''}</td>` +
    `<td>${(e.text||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}</td><td>${e.x||''},${e.y||''}</td></tr>`;
});
document.getElementById("emap").innerHTML = rows + "</table>";
document.getElementById("dec").textContent = R.decision ? JSON.stringify(R.decision, null, 2) : (R.error || "–");
document.getElementById("prom").textContent = R.prompt || "– (heuristic path: no model prompt)";
document.getElementById("rul").textContent = (R.rules||[]).join("\n") || "– none –";
document.getElementById("mem").textContent = (R.memory_ctx||[]).join("\n") || "– empty –";
document.getElementById("foot").textContent =
  (R.ts||"") + "  ·  session " + (R.session||"–") + "  ·  " + (R.url||"") +
  (R.model ? "  ·  model " + R.model : "");
</script></body></html>

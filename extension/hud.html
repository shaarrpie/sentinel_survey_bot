<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg0:#0d1320; --bg1:#121b2d; --line:#20304c;
    --ink:#dbe6f5; --dim:#7e90ac; --faint:#4d5f7c;
    --ok:#3ddc84; --err:#ff6161; --warn:#ffb347; --ai:#59c2ff; --act:#9db4d6;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    min-width:300px; min-height:380px;
    display:flex; flex-direction:column;
    padding:0 12px 10px; color:var(--ink); overflow:hidden;
    font-family:"Segoe UI","Helvetica Neue",sans-serif;
    background:
      radial-gradient(460px 240px at -10% -20%, rgba(89,194,255,.10), transparent 60%),
      radial-gradient(420px 260px at 112% 122%, rgba(61,220,132,.08), transparent 62%),
      repeating-linear-gradient(0deg,  transparent 0 23px, rgba(126,144,172,.05) 23px 24px),
      repeating-linear-gradient(90deg, transparent 0 23px, rgba(126,144,172,.04) 23px 24px),
      linear-gradient(160deg, var(--bg1), var(--bg0));
  }
  .display{
    font-family:Bahnschrift,"Avenir Next Condensed","Arial Narrow","Segoe UI",sans-serif;
  }
  #dragbar{
    display:flex; align-items:center; gap:10px;
    padding:10px 2px 10px; cursor:grab; user-select:none;
    border-bottom:1px solid var(--line); flex:none;
  }
  body.dragging #dragbar{ cursor:grabbing; }
  .grip{
    width:24px; height:14px; flex:none; opacity:.55;
    background-image:radial-gradient(circle, var(--faint) 1.2px, transparent 1.4px);
    background-size:7px 7px;
  }
  .lamp{ width:12px; height:12px; border-radius:50%; background:#3a4a66; flex:none; }
  body.running .lamp{
    background:var(--ok);
    box-shadow:0 0 0 3px rgba(61,220,132,.16), 0 0 13px rgba(61,220,132,.55);
    animation:pulse 1.6s ease-in-out infinite;
  }
  body.running.alert .lamp{
    background:var(--warn);
    box-shadow:0 0 0 3px rgba(255,179,71,.16), 0 0 13px rgba(255,179,71,.5);
  }
  @keyframes pulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(.76);} }
  .stateword{ font-size:22px; font-weight:700; letter-spacing:.15em; line-height:1; color:var(--dim); white-space:nowrap; }
  body.running .stateword{ color:var(--ok); }
  body.running.alert .stateword{ color:var(--warn); }
  .stateword.flash{ color:var(--warn); }
  .uptime{ margin-left:auto; text-align:right; }
  .uptime b{
    display:block; font-family:ui-monospace,Consolas,monospace;
    font-size:14px; font-weight:600; letter-spacing:.05em;
    font-variant-numeric:tabular-nums;
  }
  .uptime span{ font-size:8px; letter-spacing:.24em; color:var(--faint); }
  #close{
    margin-left:8px; width:22px; height:22px; flex:none;
    background:transparent; border:1px solid var(--line); border-radius:4px;
    color:var(--dim); font-size:13px; line-height:1; cursor:pointer;
    transition:color .12s, border-color .12s, background .12s;
  }
  #close:hover{ color:#ffd9d9; border-color:#7f2f35; background:rgba(127,47,53,.25); }
  .stats{
    display:flex; gap:14px; flex-wrap:wrap; padding:8px 2px;
    font-family:ui-monospace,Consolas,monospace; font-size:10.5px;
    color:var(--dim); border-bottom:1px solid var(--line); flex:none;
    font-variant-numeric:tabular-nums;
  }
  .stats b{ color:var(--ink); font-weight:600; }
  .stats .p b{ color:var(--err); }
  .loghead{
    display:flex; justify-content:space-between; padding:8px 2px 5px;
    font-size:9px; letter-spacing:.26em; color:var(--faint); flex:none;
  }
  .logwrap{ position:relative; flex:1; min-height:0; }
  #logs{
    height:100%; overflow-y:auto; border:1px solid var(--line); border-radius:5px;
    padding:6px 7px; background:rgba(8,12,21,.74);
    font-family:ui-monospace,Consolas,monospace; font-size:10.5px; line-height:1.55;
  }
  #logs::-webkit-scrollbar{ width:8px; }
  #logs::-webkit-scrollbar-thumb{ background:#22304a; border-radius:4px; }
  .scan{
    position:absolute; left:1px; right:1px; top:0; height:36px;
    pointer-events:none; border-radius:5px; opacity:.5;
    background:linear-gradient(180deg, transparent, rgba(89,194,255,.06) 55%, rgba(89,194,255,.10) 60%, transparent);
    animation:scanmove 7s linear infinite;
  }
  @keyframes scanmove{ from{ transform:translateY(-40px);} to{ transform:translateY(calc(100% + 520px));} }
  .empty{ color:var(--faint); font-style:italic; padding:6px 2px; }
  .row{ display:flex; gap:7px; animation:in .18s ease-out; }
  @keyframes in{ from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:none;} }
  .row time{ color:var(--faint); flex:none; }
  .row .msg{ white-space:pre-wrap; word-break:break-word; }
  .ok .msg{ color:var(--ok); }   .err .msg{ color:var(--err); }
  .warn .msg{ color:var(--warn);} .ai .msg{ color:var(--ai); }
  .act .msg{ color:var(--act); }  .dim .msg{ color:var(--dim); }
  .info .msg{ color:#c3d2e8; }
  .controls{ display:flex; gap:8px; margin-top:10px; flex:none; }
  button.ctl{
    flex:1; padding:8px 0; border:none; border-radius:5px;
    font-family:inherit; font-size:11.5px; font-weight:700; letter-spacing:.14em;
    cursor:pointer; transition:transform .06s ease, filter .15s ease;
  }
  button.ctl:active:not(:disabled){ transform:translateY(1px); }
  button.ctl:disabled{ opacity:.38; cursor:default; }
  #start{ background:var(--ok); color:#07301a; }
  #start:hover:not(:disabled){ filter:brightness(1.08); }
  #stop{ background:#7f2f35; color:#ffd9d9; }
  #stop:hover:not(:disabled){ filter:brightness(1.12); }
  .foot{
    display:flex; justify-content:space-between; gap:8px; margin-top:8px;
    font-family:ui-monospace,Consolas,monospace; font-size:9px; color:var(--faint);
    flex:none;
  }
  .pulse{ display:inline-flex; align-items:center; gap:5px; font-family:ui-monospace,Consolas,monospace; font-size:10px; color:var(--faint); }
  .pulse .dot{ width:7px; height:7px; border-radius:50%; background:var(--faint); transition:background .3s, box-shadow .3s; }
  .pulse.online .dot{ background:var(--ok); box-shadow:0 0 8px rgba(61,220,132,.7); }
  .pulse.dry .dot{ background:#ffb347; box-shadow:0 0 8px rgba(255,179,71,.7); }
  .pulse.offline .dot{ background:#ff6161; box-shadow:0 0 8px rgba(255,97,97,.7); }
  @media (prefers-reduced-motion: reduce){
    .lamp, .row, .scan{ animation:none !important; }
  }
</style>
</head>
<body>
  <header id="dragbar" title="drag to move">
    <div class="grip"></div>
    <div class="lamp"></div>
    <div class="stateword display" id="stateword">STOPPED</div>
    <div class="uptime">
      <b id="uptime">--:--:--</b>
      <span>UPTIME</span>
    </div>
    <div class="pulse" id="pulse" title="backend status"><i class="dot"></i><span id="pulseTxt">brain: …</span></div>
    <button id="close" title="hide HUD">×</button>
  </header>

  <div class="stats">
    <span>DECISIONS <b id="stDec">0</b></span>
    <span>ACTIONS <b id="stAct">0</b></span>
    <span class="p">PROBLEMS <b id="stErr">0</b></span>
  </div>

  <div class="loghead">
    <span>DEBUG CONSOLE</span>
    <span id="buffer">buffer 0/200</span>
  </div>
  <div class="logwrap">
    <div id="logs"><div class="empty">— waiting for first signal —</div></div>
    <div class="scan"></div>
  </div>

  <div class="controls">
    <button class="ctl" id="start">▶ START</button>
    <button class="ctl" id="stop">■ STOP</button>
    <button class="ctl" id="opendebug" title="open trace replay console">⌨ DEBUG</button>
  </div>

  <div class="foot">
    <span>backend 127.0.0.1:8000</span>
    <span id="tabinfo"></span>
  </div>

  <script src="hud.js"></script>
</body>
</html>
